# 站点质量策略配置
# Round59 用于决定哪些站点不参与校准训练、哪些需要单独标记

zero_actual_sites:
  # 测试期 6-19 实际功率总量接近 0 的站点，不参与普通模型校准
  # 这些站点可能处于停运、限电或遮挡状态
  - S003   # 国能汇菇源
  - S044   # 国能汇菇源光伏电站
  - S069   # 沐恒东海科创园光伏电站
  - S076   # 太阳光东海光伏电站
  - S077   # 富云图河光伏电站

low_confidence_geo_sites:
  # 经纬度置信度低的站点，需要外部数据确认后才能作为辐照特征来源
  - S116   # 林洋伊山光伏发电站（confidence=low，来自镇中心近似）

capacity_mapping_review_sites:
  # 预测系统性偏高/偏低超过 30% 的站点，建议核查实际装机容量
  - S053   # 鹰游新立成光伏发电站（低估 34%）
  - S012   # 泰富如意情光伏电站（高估 158%）
  - S023   # 连洋徐圩光伏发电站（高估 94%）

irradiance_review_sites:
  # g_blend_pred 长期为零或辐照特征异常的站点，建议排查辐照特征链路
  - S032   # 华能中林光伏电站（辐照特征可能缺失，严重低估 73%）
  - S046   # 国能新易春光伏电站（辐照异常，低估 38%）
  - S020   # 国能赫睿光伏电站（辐照异常，低估 37%）
  - S019   # 首耀新海光伏电站（辐照异常，低估 28%）

calibration_exclude_sites:
  # 不参与站点级校准参数学习的站点，避免用异常站点污染校准器
  # 自动包含 zero_actual_sites
  - S003
  - S044
  - S069
  - S076
  - S077

model_training_exclude_sites:
  # 不参与 hour×scene 校准学习的站点
  # 仅排除 zero_actual_sites（这些站点的场景标签可能不可靠）
  - S003
  - S044
  - S069
  - S076
  - S077
